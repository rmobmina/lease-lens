<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe Print, Bradley Hand, Comic Sans MS, cursive" font-size="14" fill="none" stroke="#333" stroke-linecap="round">
  <rect x="0" y="0" width="900" height="430" fill="#fbfaf5" stroke="none"/>
  <text x="20" y="30" fill="#333" stroke="none" font-size="17">Sketch 1: radial "fingerprint"</text>
  <text x="470" y="30" fill="#333" stroke="none" font-size="17">Sketch 2: grouped strip (chosen)</text>

  <!-- radial sketch -->
  <g transform="translate(140,215)">
    <circle r="120" stroke-dasharray="4 4"/>
    <circle r="80" stroke-dasharray="4 4"/>
    <circle r="40" stroke-dasharray="4 4"/>
    <path d="M0,-110 L28,-70 L95,-55 L60,-10 L100,40 L35,45 L10,100 L-30,60 L-90,70 L-70,10 L-105,-30 L-40,-45 Z" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-125"/><line x1="0" y1="0" x2="118" y2="-38"/><line x1="0" y1="0" x2="73" y2="101"/><line x1="0" y1="0" x2="-73" y2="101"/><line x1="0" y1="0" x2="-118" y2="-38"/>
  </g>
  <text x="20" y="372" fill="#333" stroke="none">50 spokes, 1 per item. Looks like a fingerprint,</text>
  <text x="20" y="392" fill="#333" stroke="none">but angles + radius are hard to compare,</text>
  <text x="20" y="412" fill="#a33" stroke="none">and N/A items break the outline. ✗</text>

  <!-- strip sketch -->
  <g transform="translate(470,60)">
    <text x="0" y="14" fill="#333" stroke="none">Outside</text>
    <g transform="translate(90,0)"><rect width="18" height="18"/><rect x="22" width="18" height="18" fill="#e8a37a"/><rect x="44" width="18" height="18"/><rect x="66" width="18" height="18" stroke-dasharray="3 3"/><rect x="88" width="18" height="18"/><rect x="110" width="18" height="18"/></g>
    <text x="0" y="50" fill="#333" stroke="none">Shared</text>
    <g transform="translate(90,36)"><rect width="18" height="18" fill="#c9561e"/><rect x="22" width="18" height="18"/><rect x="44" width="18" height="18" fill="#e8a37a"/><rect x="66" width="18" height="18"/><rect x="88" width="18" height="18"/><rect x="110" width="18" height="18"/><rect x="132" width="18" height="18"/></g>
    <text x="0" y="86" fill="#333" stroke="none">Garbage</text>
    <g transform="translate(90,72)"><rect width="18" height="18"/><rect x="22" width="18" height="18"/><rect x="44" width="18" height="18"/></g>
    <text x="0" y="122" fill="#333" stroke="none">Systems</text>
    <g transform="translate(90,108)"><rect width="18" height="18"/><rect x="22" width="18" height="18"/><rect x="44" width="18" height="18" fill="#e8a37a"/><rect x="66" width="18" height="18"/><rect x="88" width="18" height="18"/></g>
    <text x="0" y="158" fill="#333" stroke="none">Records</text>
    <g transform="translate(90,144)"><rect width="18" height="18" fill="#c9561e"/><rect x="22" width="18" height="18" fill="#c9561e"/><rect x="44" width="18" height="18" fill="#c9561e"/><rect x="66" width="18" height="18"/><rect x="88" width="18" height="18"/></g>
    <path d="M250,150 q30,-10 40,-40" stroke="#a33"/>
    <text x="250" y="100" fill="#a33" stroke="none">dark = low mark,</text>
    <text x="250" y="118" fill="#a33" stroke="none">pops out right away</text>
    <path d="M190,80 q20,0 30,-5" />
    <text x="215" y="70" fill="#333" stroke="none">dashed = N/A</text>
    <text x="0" y="200" fill="#333" stroke="none">Same positions for every building →</text>
    <text x="0" y="220" fill="#333" stroke="none">put two side by side, eyes jump to</text>
    <text x="0" y="240" fill="#333" stroke="none">the squares that differ.</text>
    <text x="0" y="280" fill="#333" stroke="none">Bldg A (92)  ▢▢▣▢▣▣▣    Bldg B (92)  ▢▢▢▢▢▢▢</text>
    <text x="0" y="310" fill="#333" stroke="none">TODO: city "typical" row? hover = item name</text>
    <text x="0" y="330" fill="#333" stroke="none">+ rating + date. List the low items in text.</text>
  </g>
</svg>
